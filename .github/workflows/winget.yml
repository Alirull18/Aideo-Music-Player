name: "Publish to WinGet"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        type: choice
        required: true
        default: 'update'
        options:
          - 'update'
          - 'submit-initial'
      version:
        description: 'Version without v prefix (e.g. 0.9.11) - only needed for update'
        required: false
        default: ''

jobs:
  winget:
    name: WinGet Automation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify WINGET_TOKEN Secret
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Error "WINGET_TOKEN secret is not set in repository Secrets! Please create a Personal Access Token (classic with 'public_repo' scope) and add it as WINGET_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          }

      - name: Initial WinGet Registration (v0.9.10)
        if: github.event.inputs.action == 'submit-initial'
        shell: pwsh
        run: |
          winget install --id Microsoft.WingetCreate --exact --accept-source-agreements --accept-package-agreements
          wingetcreate submit "winget/0.9.10" --token "${{ secrets.WINGET_TOKEN }}"

      - name: Extract target version
        if: github.event.inputs.action != 'submit-initial'
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and "$env:INPUT_VERSION" -ne "") {
            $ver = "$env:INPUT_VERSION".TrimStart('v')
          } else {
            $ver = "$env:RELEASE_TAG".TrimStart('v')
          }
          if (-not $ver) {
            throw "Version could not be determined."
          }
          Write-Host "Publishing version $ver to WinGet"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update existing package in WinGet
        if: github.event.inputs.action != 'submit-initial'
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Alirul.Aideo
          version: ${{ steps.target.outputs.version }}
          installer-url: https://github.com/Alirull18/Aideo-Music-Player/releases/download/v${{ steps.target.outputs.version }}/Aideo_${{ steps.target.outputs.version }}_x64-setup.exe
          token: ${{ secrets.WINGET_TOKEN }}
