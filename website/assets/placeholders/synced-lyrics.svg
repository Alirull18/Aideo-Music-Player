<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="lyric-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181f" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#lyric-bg)" stroke="#262e39" stroke-width="1.5" />

  <!-- Header -->
  <rect x="0" y="0" width="800" height="46" rx="14" fill="#181d24" />
  <rect x="0" y="24" width="800" height="22" fill="#181d24" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#28323e" stroke-width="1" />

  <text x="24" y="28" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SYNCHRONIZED ROMAJI & DESKTOP HUD</text>
  <text x="330" y="28" fill="#8e9ca8" font-family="monospace" font-size="11">LRC • LRCLIB • MUSIXMATCH • 1-CLICK TRANSLITERATION</text>
  
  <rect x="668" y="12" width="108" height="22" rx="4" fill="#1f241a" stroke="#72c442" stroke-opacity="0.5" stroke-width="1" />
  <text x="680" y="27" fill="#72c442" font-family="monospace" font-size="11">HUD GAMING: ON</text>

  <!-- Left: Main In-App Karaoke Stream -->
  <rect x="24" y="66" width="440" height="390" rx="10" fill="#101318" stroke="#202732" stroke-width="1" />
  <text x="44" y="96" fill="#8e9ca8" font-family="monospace" font-size="10.5" font-weight="600" letter-spacing="0.1em">NOW PLAYING: YOASOBI — GUNJOU (群青)</text>

  <!-- Inactive Line 1 -->
  <text x="44" y="140" fill="#3e4752" font-family="system-ui, sans-serif" font-size="13">Aa, itsumo no you ni</text>
  <text x="44" y="158" fill="#2d3540" font-family="system-ui, sans-serif" font-size="11.5">Ah, just like always, passing by</text>

  <!-- Inactive Line 2 -->
  <text x="44" y="200" fill="#5c6877" font-family="system-ui, sans-serif" font-size="14">Sugisaru hibi ni akubi ga deru</text>
  <text x="44" y="220" fill="#3e4752" font-family="system-ui, sans-serif" font-size="12">Yawning at the days that slip away</text>

  <!-- Active Line Highlighted with Glowing Pill -->
  <rect x="36" y="244" width="416" height="84" rx="8" fill="#16232e" stroke="#00b8d4" stroke-opacity="0.35" stroke-width="1" />
  <circle cx="54" cy="272" r="4" fill="#00e5ff" />
  <text x="68" y="276" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Afuredashita omoi wo ima</text>
  <text x="68" y="298" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="500">The feelings that overflowed right now</text>
  <text x="68" y="318" fill="#8e9ca8" font-family="monospace" font-size="10.5">Kanji: 溢れ出した想いを今 [01:42.500]</text>

  <!-- Upcoming Line 1 -->
  <text x="44" y="365" fill="#697685" font-family="system-ui, sans-serif" font-size="14">Kotoba ni suru no wa kowai keredo</text>
  <text x="44" y="385" fill="#475260" font-family="system-ui, sans-serif" font-size="12">Even if putting it into words is frightening</text>

  <!-- Upcoming Line 2 -->
  <text x="44" y="425" fill="#3e4752" font-family="system-ui, sans-serif" font-size="13">Boku ni shika dekinai koto ga aru</text>
  <text x="44" y="443" fill="#2d3540" font-family="system-ui, sans-serif" font-size="11.5">There are things only I can do</text>

  <!-- Right: Floating Desktop HUD Transparent Mode -->
  <rect x="480" y="66" width="296" height="390" rx="10" fill="#0d1014" stroke="#252e3b" stroke-width="1" />
  
  <text x="500" y="96" fill="#8e9ca8" font-family="monospace" font-size="11" font-weight="600">CLICK-THROUGH DESKTOP HUD</text>
  <text x="500" y="116" fill="#586675" font-family="system-ui, sans-serif" font-size="12">Floating over fullscreen games & apps</text>

  <!-- Floating HUD Window Simulation -->
  <rect x="496" y="140" width="264" height="150" rx="8" fill="#131a24" fill-opacity="0.85" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4,2" />
  
  <rect x="506" y="150" width="64" height="18" rx="3" fill="#00b8d4" fill-opacity="0.15" />
  <text x="512" y="163" fill="#00e5ff" font-family="monospace" font-size="9.5">PINNED TOP</text>

  <rect x="670" y="150" width="80" height="18" rx="3" fill="#262f3a" />
  <text x="678" y="163" fill="#8e9ca8" font-family="monospace" font-size="9.5">TRANSPARENT</text>

  <text x="510" y="210" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">Afuredashita omoi wo ima</text>
  <text x="510" y="235" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="12">The feelings that overflowed right now</text>

  <circle cx="516" cy="265" r="3" fill="#e28c30" />
  <text x="526" y="269" fill="#e28c30" font-family="monospace" font-size="10.5">Click-Through Zero Input Lag</text>

  <!-- Feature Tags in Lower Right -->
  <rect x="496" y="310" width="264" height="130" rx="8" fill="#12161c" stroke="#202732" stroke-width="1" />
  <text x="512" y="335" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Capabilities</text>
  
  <text x="512" y="360" fill="#8e9ca8" font-family="system-ui, sans-serif" font-size="11.5">• Automatic Romaji transliteration for J-Pop</text>
  <text x="512" y="380" fill="#8e9ca8" font-family="system-ui, sans-serif" font-size="11.5">• LRCLIB open database auto-synchronization</text>
  <text x="512" y="400" fill="#8e9ca8" font-family="system-ui, sans-serif" font-size="11.5">• Local .LRC file auto-detection & pairing</text>
  <text x="512" y="420" fill="#8e9ca8" font-family="system-ui, sans-serif" font-size="11.5">• Custom font size, opacity & dual-line display</text>
</svg>
