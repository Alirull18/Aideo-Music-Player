<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="eq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181e" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>
    <linearGradient id="curve-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b8d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00b8d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#eq-bg)" stroke="#262e39" stroke-width="1.5" />

  <!-- Studio Header -->
  <rect x="0" y="0" width="800" height="46" rx="14" fill="#181d24" />
  <rect x="0" y="24" width="800" height="22" fill="#181d24" />
  <line x1="0" y1="46" x2="800" y2="46" stroke="#28323e" stroke-width="1" />

  <text x="24" y="28" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AUTOEQ PARAMETRIC STUDIO</text>
  <text x="240" y="28" fill="#8e9ca8" font-family="system-ui, sans-serif" font-size="12">Profile: Sennheiser HD600 (Harman Over-Ear Target)</text>
  
  <rect x="640" y="12" width="136" height="22" rx="4" fill="#00b8d4" fill-opacity="0.12" stroke="#00b8d4" stroke-opacity="0.4" stroke-width="1" />
  <text x="652" y="27" fill="#00e5ff" font-family="monospace" font-size="11" font-weight="600">BIQUAD IIR FILTERS</text>

  <!-- Frequency Grid -->
  <g stroke="#1e252f" stroke-width="1">
    <!-- Horizontal dB lines -->
    <line x1="60" y1="90" x2="740" y2="90" stroke-dasharray="3,3" />
    <line x1="60" y1="140" x2="740" y2="140" stroke-dasharray="3,3" />
    <line x1="60" y1="190" x2="740" y2="190" stroke-width="1.5" stroke="#2d3744" /> <!-- 0 dB Reference -->
    <line x1="60" y1="240" x2="740" y2="240" stroke-dasharray="3,3" />
    <line x1="60" y1="290" x2="740" y2="290" stroke-dasharray="3,3" />

    <!-- Vertical Hz lines -->
    <line x1="120" y1="65" x2="120" y2="310" stroke-dasharray="3,3" />
    <line x1="210" y1="65" x2="210" y2="310" stroke-dasharray="3,3" />
    <line x1="310" y1="65" x2="310" y2="310" stroke-dasharray="3,3" />
    <line x1="430" y1="65" x2="430" y2="310" stroke-dasharray="3,3" />
    <line x1="560" y1="65" x2="560" y2="310" stroke-dasharray="3,3" />
    <line x1="680" y1="65" x2="680" y2="310" stroke-dasharray="3,3" />
  </g>

  <!-- dB Axis Labels -->
  <text x="24" y="94" fill="#586675" font-family="monospace" font-size="10.5">+12 dB</text>
  <text x="30" y="144" fill="#586675" font-family="monospace" font-size="10.5">+6 dB</text>
  <text x="30" y="194" fill="#8e9ca8" font-family="monospace" font-size="10.5" font-weight="600"> 0 dB</text>
  <text x="30" y="244" fill="#586675" font-family="monospace" font-size="10.5">-6 dB</text>
  <text x="24" y="294" fill="#586675" font-family="monospace" font-size="10.5">-12 dB</text>

  <!-- Frequency Axis Labels -->
  <text x="110" y="328" fill="#586675" font-family="monospace" font-size="10.5">50 Hz</text>
  <text x="200" y="328" fill="#586675" font-family="monospace" font-size="10.5">200 Hz</text>
  <text x="300" y="328" fill="#586675" font-family="monospace" font-size="10.5">1 kHz</text>
  <text x="420" y="328" fill="#586675" font-family="monospace" font-size="10.5">4 kHz</text>
  <text x="550" y="328" fill="#586675" font-family="monospace" font-size="10.5">10 kHz</text>
  <text x="670" y="328" fill="#586675" font-family="monospace" font-size="10.5">20 kHz</text>

  <!-- Reference Target Curve (Dashed Amber) -->
  <path d="M 60 185 C 120 160, 210 180, 310 190 C 430 195, 520 160, 560 145 C 620 180, 680 195, 740 210" fill="none" stroke="#e28c30" stroke-width="1.8" stroke-dasharray="4,3" />

  <!-- Active Corrective Response Curve Area & Line (Cyan) -->
  <path d="M 60 190 C 100 135, 140 145, 180 170 C 230 190, 280 195, 340 190 C 400 180, 460 215, 520 205 C 570 170, 610 140, 660 165 C 700 185, 720 190, 740 192 L 740 310 L 60 310 Z" fill="url(#curve-fill)" />
  <path d="M 60 190 C 100 135, 140 145, 180 170 C 230 190, 280 195, 340 190 C 400 180, 460 215, 520 205 C 570 170, 610 140, 660 165 C 700 185, 720 190, 740 192" fill="none" stroke="#00e5ff" stroke-width="2.5" />

  <!-- Interactive Nodes -->
  <circle cx="100" cy="148" r="6" fill="#00e5ff" stroke="#0c0e12" stroke-width="2" />
  <circle cx="230" cy="188" r="6" fill="#00e5ff" stroke="#0c0e12" stroke-width="2" />
  <circle cx="340" cy="190" r="6" fill="#00e5ff" stroke="#0c0e12" stroke-width="2" />
  <circle cx="475" cy="212" r="6" fill="#00e5ff" stroke="#0c0e12" stroke-width="2" />
  <circle cx="585" cy="160" r="6" fill="#00e5ff" stroke="#0c0e12" stroke-width="2" />
  <circle cx="660" cy="165" r="6" fill="#00e5ff" stroke="#0c0e12" stroke-width="2" />

  <!-- Filter Sliders Strip at Bottom -->
  <rect x="20" y="348" width="760" height="114" rx="8" fill="#111419" stroke="#222b36" stroke-width="1" />
  
  <!-- 5 Bands Representation -->
  <g transform="translate(45, 360)">
    <!-- Band 1 -->
    <text x="0" y="12" fill="#8e9ca8" font-family="monospace" font-size="10">SUB BASS</text>
    <line x1="20" y1="25" x2="20" y2="75" stroke="#242c37" stroke-width="3" stroke-linecap="round" />
    <circle cx="20" cy="40" r="5" fill="#00e5ff" />
    <text x="8" y="92" fill="#00e5ff" font-family="monospace" font-size="10">+5.2 dB</text>

    <!-- Band 2 -->
    <text x="95" y="12" fill="#8e9ca8" font-family="monospace" font-size="10">BASS</text>
    <line x1="110" y1="25" x2="110" y2="75" stroke="#242c37" stroke-width="3" stroke-linecap="round" />
    <circle cx="110" cy="48" r="5" fill="#00e5ff" />
    <text x="98" y="92" fill="#00e5ff" font-family="monospace" font-size="10">+1.8 dB</text>

    <!-- Band 3 -->
    <text x="180" y="12" fill="#8e9ca8" font-family="monospace" font-size="10">LOW MID</text>
    <line x1="200" y1="25" x2="200" y2="75" stroke="#242c37" stroke-width="3" stroke-linecap="round" />
    <circle cx="200" cy="50" r="5" fill="#8e9ca8" />
    <text x="190" y="92" fill="#8e9ca8" font-family="monospace" font-size="10"> 0.0 dB</text>

    <!-- Band 4 -->
    <text x="270" y="12" fill="#8e9ca8" font-family="monospace" font-size="10">PRESENCE</text>
    <line x1="290" y1="25" x2="290" y2="75" stroke="#242c37" stroke-width="3" stroke-linecap="round" />
    <circle cx="290" cy="58" r="5" fill="#00e5ff" />
    <text x="280" y="92" fill="#00e5ff" font-family="monospace" font-size="10">-2.4 dB</text>

    <!-- Band 5 -->
    <text x="360" y="12" fill="#8e9ca8" font-family="monospace" font-size="10">TREBLE AIR</text>
    <line x1="385" y1="25" x2="385" y2="75" stroke="#242c37" stroke-width="3" stroke-linecap="round" />
    <circle cx="385" cy="38" r="5" fill="#00e5ff" />
    <text x="374" y="92" fill="#00e5ff" font-family="monospace" font-size="10">+4.1 dB</text>
  </g>

  <!-- Legend & Export Actions -->
  <circle cx="560" cy="380" r="4" fill="#00e5ff" />
  <text x="572" y="384" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="11">Calculated AutoEQ Compensation</text>

  <line x1="556" y1="404" x2="564" y2="404" stroke="#e28c30" stroke-width="2" stroke-dasharray="3,2" />
  <text x="572" y="408" fill="#e28c30" font-family="system-ui, sans-serif" font-size="11">Harman Over-Ear Target Curve</text>

  <rect x="556" y="424" width="205" height="24" rx="4" fill="#1b232c" stroke="#2d3846" stroke-width="1" />
  <text x="570" y="440" fill="#8e9ca8" font-family="monospace" font-size="10.5">EXPORT EQUALIZER APO .TXT</text>
</svg>
