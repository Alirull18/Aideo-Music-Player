  <rect x="200" y="178" width="8" height="8" fill="#00e5ff" />
  <rect x="168" y="194" width="12" height="12" fill="#00e5ff" />
  <rect x="190" y="200" width="8" height="8" fill="#00e5ff" />
  <rect x="174" y="220" width="14" height="14" fill="#e28c30" /> <!-- center emblem -->
  <rect x="200" y="226" width="8" height="8" fill="#00e5ff" />
  <rect x="216" y="220" width="10" height="10" fill="#00e5ff" />
  <rect x="168" y="246" width="12" height="8" fill="#00e5ff" />
  <rect x="188" y="254" width="14" height="10" fill="#00e5ff" />
  <rect x="210" y="250" width="8" height="8" fill="#00e5ff" />
  <rect x="168" y="278" width="8" height="8" fill="#00e5ff" />
