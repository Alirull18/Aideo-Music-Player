  <circle cx="530" cy="207" r="38" fill="#12161c" stroke="#00e5ff" stroke-width="1.5" />
  <circle cx="530" cy="207" r="14" fill="#1f2631" stroke="#e28c30" stroke-width="1" />
  
  <text x="585" y="195" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Acoustic Suite</text>
