  <circle cx="488" cy="406" r="4" stroke="#00e5ff" stroke-width="1.5" />
  <line x1="504" y1="406" x2="702" y2="406" stroke="#252f3d" stroke-width="3" stroke-linecap="round" />
  <line x1="504" y1="406" x2="650" y2="406" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" />
