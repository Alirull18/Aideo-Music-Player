  <text x="328" y="168" fill="#8e9ca8" font-family="monospace" font-size="11">Lock-Free Ring Buffer • Gapless Pipeline</text>

  <!-- DSP Stage -->
  <rect x="314" y="195" width="274" height="74" rx="6" fill="#171e28" stroke="#273343" stroke-width="1" />
  <text x="328" y="218" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">DSP & Biquad Filter Pipeline</text>
  <text x="328" y="238" fill="#e28c30" font-family="monospace" font-size="11">AutoEQ 4000+ • 10-Band Parametric</text>
  <text x="328" y="254" fill="#8e9ca8" font-family="monospace" font-size="10.5">True Bypass mode when bit-perfect requested</text>

  <!-- Visualizer FFT Thread -->
  <rect x="314" y="280" width="274" height="60" rx="6" fill="#171e28" stroke="#273343" stroke-width="1" />
  <text x="328" y="303" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Ballistic FFT Analysis Worker</text>
  <text x="328" y="323" fill="#8e9ca8" font-family="monospace" font-size="11">2048-pt FFT • Zero CPU Draw When Idle</text>

  <!-- CPAL WASAPI Abstraction -->
  <rect x="314" y="352" width="274" height="78" rx="6" fill="#1a2533" stroke="#00b8d4" stroke-opacity="0.4" stroke-width="1" />
  <text x="328" y="375" fill="#00e5ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CPAL WASAPI Driver Layer</text>
  <text x="328" y="396" fill="#f3f6f8" font-family="monospace" font-size="11">Exclusive Device Stream Mode</text>
  <text x="328" y="414" fill="#8e9ca8" font-family="monospace" font-size="10.5">Direct buffer transfer • Unity gain</text>

  <!-- Connecting Arrows to Output -->
  <path d="M 606 390 L 666 390" stroke="#00e5ff" stroke-width="2.5" />
  <polygon points="666,390 658,385 658,395" fill="#00e5ff" />

  <path d="M 606 310 L 666 220" stroke="#8e9ca8" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Right: Hardware Output & UI IPC -->
  <rect x="672" y="75" width="198" height="370" rx="10" fill="#101318" stroke="#242c38" stroke-width="1" />
  <text x="690" y="105" fill="#8e9ca8" font-family="monospace" font-size="11" font-weight="600">ENDPOINTS</text>

  <!-- Tauri IPC & UI -->
  <rect x="684" y="125" width="174" height="110" rx="8" fill="#161c24" stroke="#273240" stroke-width="1" />
  <text x="696" y="150" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Tauri v2 IPC Bridge</text>
  <text x="696" y="170" fill="#8e9ca8" font-family="system-ui, sans-serif" font-size="11">React 19 Frontend</text>
  <text x="696" y="188" fill="#586675" font-family="monospace" font-size="10.5">Zustand State</text>
  <text x="696" y="216" fill="#00e5ff" font-family="monospace" font-size="10">60fps RAF Canvas</text>

  <!-- DAC Hardware Direct -->
  <rect x="684" y="260" width="174" height="170" rx="8" fill="#16232c" stroke="#00e5ff" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="696" y="274" width="76" height="18" rx="3" fill="#00e5ff" fill-opacity="0.2" />
  <text x="702" y="287" fill="#00e5ff" font-family="monospace" font-size="9.5">HARDWARE</text>
  
  <text x="696" y="314" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">External DAC</text>
  <text x="696" y="334" fill="#8e9ca8" font-family="system-ui, sans-serif" font-size="11">USB / Optical Audio</text>

  <line x1="696" y1="348" x2="846" y2="348" stroke="#2a3848" stroke-width="1" />

  <text x="696" y="370" fill="#4ade80" font-family="monospace" font-size="11">✓ Windows Mixer</text>
  <text x="796" y="370" fill="#e28c30" font-family="monospace" font-size="10.5">BYPASS</text>

  <text x="696" y="392" fill="#4ade80" font-family="monospace" font-size="11">✓ Resampling</text>
  <text x="796" y="392" fill="#e28c30" font-family="monospace" font-size="10.5">0% ZERO</text>

  <text x="696" y="414" fill="#4ade80" font-family="monospace" font-size="11">✓ Dithering</text>
  <text x="796" y="414" fill="#e28c30" font-family="monospace" font-size="10.5">OFF PURE</text>
</svg>
