<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13171e" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="14" fill="url(#arch-bg)" stroke="#262e39" stroke-width="1.5" />

  <!-- Header -->
  <rect x="0" y="0" width="900" height="46" rx="14" fill="#181d24" />
  <rect x="0" y="24" width="900" height="22" fill="#181d24" />
  <line x1="0" y1="46" x2="900" y2="46" stroke="#28323e" stroke-width="1" />

  <text x="24" y="28" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AIDEO ARCHITECTURE & HARDWARE SIGNAL PATH</text>
  <text x="400" y="28" fill="#8e9ca8" font-family="monospace" font-size="11">RUST AUDIO THREAD ↔ TAURI IPC ↔ REACT 19 UI</text>
  
  <rect x="760" y="12" width="116" height="22" rx="4" fill="#1c2420" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1" />
  <text x="772" y="27" fill="#4ade80" font-family="monospace" font-size="11">BIT-PERFECT</text>

  <!-- Left: Audio Sources Input -->
  <rect x="30" y="75" width="220" height="370" rx="10" fill="#101318" stroke="#242c38" stroke-width="1" />
  <text x="48" y="105" fill="#8e9ca8" font-family="monospace" font-size="11" font-weight="600">INPUT SOURCES</text>

  <!-- Box 1: Local FLAC / DSD -->
  <rect x="46" y="125" width="188" height="66" rx="8" fill="#171d26" stroke="#2e3846" stroke-width="1" />
  <text x="58" y="150" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Local High-Res Files</text>
  <text x="58" y="170" fill="#00e5ff" font-family="monospace" font-size="11">FLAC • WAV • ALAC • DSD</text>

  <!-- Box 2: SQLite FTS5 Database -->
  <rect x="46" y="205" width="188" height="66" rx="8" fill="#171d26" stroke="#2e3846" stroke-width="1" />
  <text x="58" y="230" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SQLite FTS5 Library</text>
  <text x="58" y="250" fill="#8e9ca8" font-family="monospace" font-size="11">Instant Full-Text Search</text>

  <!-- Box 3: Cloud & Web Streams -->
  <rect x="46" y="285" width="188" height="66" rx="8" fill="#171d26" stroke="#2e3846" stroke-width="1" />
  <text x="58" y="310" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Hybrid Web Streaming</text>
  <text x="58" y="330" fill="#8e9ca8" font-family="monospace" font-size="11">HLS Streams • Tidal Lossless</text>

  <!-- Box 4: LRCLIB Lyrics -->
  <rect x="46" y="365" width="188" height="66" rx="8" fill="#171d26" stroke="#2e3846" stroke-width="1" />
  <text x="58" y="390" fill="#f3f6f8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Synced Lyrics Cache</text>
  <text x="58" y="410" fill="#8e9ca8" font-family="monospace" font-size="11">Musixmatch & LRCLIB APIs</text>

  <!-- Connecting Arrows to Center -->
  <path d="M 234 158 L 290 158" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="290,158 284,154 284,162" fill="#00e5ff" />

  <path d="M 234 238 L 290 238" stroke="#8e9ca8" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="290,238 284,234 284,242" fill="#8e9ca8" />

  <path d="M 234 318 L 290 318" stroke="#8e9ca8" stroke-width="2" stroke-dasharray="4,3" />
  <polygon points="290,318 284,314 284,322" fill="#8e9ca8" />

  <!-- Center: Rust Real-Time Audio Engine -->
  <rect x="296" y="75" width="310" height="370" rx="10" fill="#121720" stroke="#00b8d4" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="306" y="86" width="290" height="28" rx="5" fill="#192330" />
  <text x="320" y="105" fill="#00e5ff" font-family="monospace" font-size="11.5" font-weight="700">RUST NATIVE ENGINE CORE</text>

  <!-- Ring Buffer / Decoder -->
  <rect x="314" y="125" width="274" height="60" rx="6" fill="#171e28" stroke="#273343" stroke-width="1" />
